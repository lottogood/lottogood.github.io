<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="로또굿 로또6/45 당첨 결과 상세 리포트">
  <title>당첨 결과 리포트 | 로또굿</title>
  <style>
    :root{--green:#146c43;--deep:#0a3d27;--lime:#d9f99d;--cream:#f8f7f1;--ink:#1b2923;--muted:#62716a;--line:#dfe8df}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}a{color:inherit}.wrap{width:min(920px,calc(100% - 32px));margin:auto}.header{background:var(--deep);color:#fff}.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{text-decoration:none;font-size:1.25rem;font-weight:900;letter-spacing:-.06em}.brand b{color:var(--lime)}.nav a:last-child{color:var(--lime);font-size:.9rem;font-weight:800}.article{padding:42px 0 68px}.back{display:inline-block;color:var(--green);font-size:.88rem;font-weight:850;text-decoration:none;margin-bottom:22px}.article-head{padding:30px;border:1px solid #cfe1d1;border-radius:22px;background:linear-gradient(135deg,#fff,#eff8e9)}.article-head__meta{color:var(--green);font-size:.84rem;font-weight:850}.article-head h1{margin:8px 0 12px;font-size:clamp(1.8rem,5vw,2.75rem);line-height:1.18;letter-spacing:-.07em}.article-head p{margin:0;color:#3b594a}.balls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:24px 0 0}.ball{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:850}.yellow{background:#fbc400}.blue{background:#6699cc}.red{background:#ff7272}.gray{background:#aaa}.green{background:#b0d840}.plus{font-size:1.5rem;color:#8a9a91}.section{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px}.section h2{margin:0 0 13px;font-size:1.22rem;letter-spacing:-.045em}.section p{margin:9px 0;color:#405d4e}.prize-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.prize{min-width:0;padding:14px 10px;border:1px solid #dfe9dc;border-radius:12px;background:#fbfdf9}.prize strong,.prize span{display:block}.prize strong{color:var(--green);font-size:1.05rem}.prize span{margin-top:5px;font-size:.78rem;color:var(--muted)}.prize b{display:block;margin-top:9px;font-size:.84rem;word-break:keep-all}.store-note{font-size:.83rem;color:var(--muted)!important}.store-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0;margin:0;list-style:none}.store{padding:14px;border:1px solid #dfe9dc;border-radius:12px}.store strong,.store span{display:block}.store strong{font-size:.94rem;color:#173b28}.store span{margin-top:4px;font-size:.8rem;color:var(--muted)}.tag{display:inline-block!important;margin-top:7px!important;color:var(--green)!important;font-weight:850}.more{margin-top:14px}.more summary{cursor:pointer;color:var(--green);font-weight:850}.source{font-size:.8rem;color:var(--muted)}.empty{padding:32px;border:1px dashed #b9ceb9;border-radius:16px;text-align:center;color:var(--muted)}.footer{padding:28px 0;color:#607268;font-size:.82rem;border-top:1px solid var(--line)}@media(max-width:680px){.article{padding-top:27px}.article-head,.section{padding:20px}.prize-grid{grid-template-columns:repeat(2,1fr)}.store-list{grid-template-columns:1fr}.ball{width:38px;height:38px}.prize:last-child{grid-column:span 2}}
  </style>
</head>
<body>
  <header class="header"><div class="wrap nav"><a class="brand" href="index.html">로또<b>굿</b></a><a href="reports.html">리포트 목록</a></div></header>
  <main class="article"><div class="wrap" id="app"><p class="empty">리포트를 불러오는 중입니다.</p></div></main>
  <footer class="footer"><div class="wrap">로또굿 · 당첨금 및 당첨판매점 정보는 동행복권 공식 자료를 기준으로 안내합니다.</div></footer>
  <script>
    const app=document.querySelector('#app');
    const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const ballClass=n=>n<=10?'yellow':n<=20?'blue':n<=30?'red':n<=40?'gray':'green';
    const money=value=>new Intl.NumberFormat('ko-KR').format(value)+'원';
    const storeCards=stores=>stores.map(store=>'<li class="store"><strong>'+escape(store.name)+'</strong><span>'+escape(store.region)+' · '+escape(store.address)+'</span>'+(store.selection?'<span class="tag">'+escape(store.selection)+'</span>':'')+'</li>').join('');
    const queryRound=new URLSearchParams(location.search).get('round');
    const load=round=>fetch('data/reports/'+round+'.json',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject());
    (queryRound?Promise.resolve(queryRound):fetch('data/reports/index.json',{cache:'no-store'}).then(response=>response.json()).then(list=>list[0]?.round)).then(round=>round?load(round):Promise.reject()).then(report=>{
      document.title=report.title+' | 로또굿';
      const first=report.stores.first,second=report.stores.second;
      app.innerHTML='<a class="back" href="reports.html">← 당첨 결과 리포트 목록</a><article><header class="article-head"><div class="article-head__meta">공식 결과 리포트 · '+report.date.replaceAll('-','.')+'</div><h1>'+escape(report.title)+'</h1><p>'+escape(report.article.deck||report.article.lead)+'</p><div class="balls">'+report.numbers.map(number=>'<span class="ball '+ballClass(number)+'">'+number+'</span>').join('')+'<span class="plus">+</span><span class="ball '+ballClass(report.bonus)+'">'+report.bonus+'</span></div></header><section class="section"><h2>제'+report.round+'회 로또6/45 추첨 결과</h2><p>'+escape(report.article.lead)+'</p><p>'+escape(report.article.firstPrize||report.article.summary)+'</p></section><section class="section"><h2>등수별 당첨금</h2><p>'+escape(report.article.summary)+'</p><div class="prize-grid">'+report.prizes.map(prize=>'<div class="prize"><strong>'+escape(prize.rank)+'</strong><span>'+escape(prize.match)+'</span><b>'+prize.winners.toLocaleString('ko-KR')+'명</b><span>1인당 '+money(prize.prizePerWinner)+'</span></div>').join('')+'</div></section><section class="section"><h2>1등 배출 판매점 · '+first.total+'곳</h2><p class="store-note">'+escape(report.article.stores||'상호, 번호 선택 구분 및 소재지는 동행복권 공식 당첨판매점 조회 자료입니다.')+'</p>'+(first.state==='complete'?'<ul class="store-list">'+storeCards(first.list)+'</ul>':'<p>공식 판매점 정보를 확인하는 중입니다.</p>')+'</section><section class="section"><h2>2등 배출 판매점 · '+second.total+'곳</h2><p class="store-note">2등 판매점은 전체 목록을 접어서 제공합니다.</p>'+(second.state==='complete'?'<details class="more"><summary>2등 판매점 전체 보기 ('+second.total+'곳)</summary><ul class="store-list">'+storeCards(second.list)+'</ul></details>':'<p>공식 판매점 정보를 확인하는 중입니다.</p>')+'</section><p class="source">출처: <a href="'+report.sources.result+'" target="_blank" rel="noopener">동행복권 공식 회차 결과</a> · <a href="'+report.sources.stores+'" target="_blank" rel="noopener">동행복권 당첨판매점 조회</a></p></article>';
    }).catch(()=>{app.innerHTML='<p class="empty">리포트를 찾을 수 없습니다. <a href="reports.html">목록으로 돌아가기</a></p>'});
  </script>
</body>
</html>
