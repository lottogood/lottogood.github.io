name: Update Lotto result and deploy

on:
  workflow_dispatch:
  schedule:
    # Saturday 20:50, 21:10, 21:30, 21:50 and Sunday 00:10 Korea Standard Time (UTC+9)
    - cron: '50 11 * * 6'
    - cron: '10 12 * * 6'
    - cron: '30 12 * * 6'
    - cron: '50 12 * * 6'
    - cron: '10 15 * * 6'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the newest official result
        run: node scripts/update-lotto.mjs
      - name: Create or refresh the latest result report
        run: node scripts/sync-report.mjs
      - name: Commit new result data when available
        run: |
          if git diff --quiet -- data/latest.json data/history.json data/reports; then
            echo "No new result to commit."
          else
            git config user.name "lottogood-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/latest.json data/history.json data/reports
            git commit -m "Update Lotto result report"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
